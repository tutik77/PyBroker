services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  app:
    build: ./app
    ports:
      - "8000:8000"
    environment:
      CACHE_STRATEGY: ${CACHE_STRATEGY:-lazy}
      REDIS_HOST: redis
      DB_HOST: postgres
      DB_NAME: testdb
      DB_USER: postgres
      DB_PASS: postgres
      WRITEBACK_INTERVAL: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
