services:
  broker:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "9090:9090"
      - "8080:8080"
    volumes:
      - broker-data:/app/data
    environment:
      BROKER_HOST: "0.0.0.0"
      BROKER_PORT: "9090"
      BROKER_WEB_PORT: "8080"

  order_service:
    build:
      context: ..
      dockerfile: demo/Dockerfile
    command: uvicorn demo.order_service:app --host 0.0.0.0 --port 8000
    ports:
      - "8001:8000"
    environment:
      BROKER_HOST: broker
      BROKER_PORT: "9090"
    depends_on:
      - broker

  notification_service:
    build:
      context: ..
      dockerfile: demo/Dockerfile
    command: uvicorn demo.notification_service:app --host 0.0.0.0 --port 8000
    ports:
      - "8002:8000"
    environment:
      BROKER_HOST: broker
      BROKER_PORT: "9090"
    depends_on:
      - broker

  analytics_service:
    build:
      context: ..
      dockerfile: demo/Dockerfile
    command: uvicorn demo.analytics_service:app --host 0.0.0.0 --port 8000
    ports:
      - "8003:8000"
    environment:
      BROKER_HOST: broker
      BROKER_PORT: "9090"
    depends_on:
      - broker

volumes:
  broker-data:
