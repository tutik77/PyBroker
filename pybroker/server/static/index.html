<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyBroker Dashboard</title>
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --border: #334155;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --accent: #3b82f6;
            --green: #22c55e;
            --red: #ef4444;
            --orange: #f97316;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 2rem; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .header h1 { font-size: 1.5rem; font-weight: 600; }
        .header h1 span { color: var(--accent); }
        .status { display: flex; align-items: center; gap: 0.5rem; font-size: 0.875rem; color: var(--muted); }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
        .status-dot.offline { background: var(--red); }
        .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .metric-card { background: var(--surface); border-radius: 10px; padding: 1.25rem; border: 1px solid var(--border); }
        .metric-card .label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 0.5rem; }
        .metric-card .value { font-size: 1.75rem; font-weight: 700; }
        .metric-card.blue .value { color: var(--accent); }
        .metric-card.green .value { color: var(--green); }
        .metric-card.red .value { color: var(--red); }
        .metric-card.orange .value { color: var(--orange); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem; }
        @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
        .section { background: var(--surface); border-radius: 10px; padding: 1.5rem; border: 1px solid var(--border); }
        .section-title { font-size: 0.875rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 1rem; }
        table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
        th { text-align: left; padding: 0.625rem 0.75rem; color: var(--muted); font-weight: 500; border-bottom: 1px solid var(--border); }
        td { padding: 0.625rem 0.75rem; border-bottom: 1px solid var(--border); }
        tr:last-child td { border-bottom: none; }
        .empty { color: var(--muted); font-style: italic; padding: 1rem 0; text-align: center; }
        .badge { display: inline-block; padding: 0.125rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: 500; background: var(--border); }
        .badge.fifo { background: #1e3a5f; color: #60a5fa; }
        .badge.lifo { background: #3b1f4e; color: #c084fc; }
        .nav { display: flex; gap: 1rem; margin-bottom: 1.5rem; font-size: 0.8rem; }
        .nav a { color: var(--accent); text-decoration: none; }
        .nav a:hover { text-decoration: underline; }
        .nav span { color: var(--muted); }
    </style>
</head>
<body>
    <nav class="nav">
        <span>Dashboard :8080</span>
        <a href="" id="nav-orders">Orders :8001</a>
        <a href="" id="nav-notif">Notifications :8002</a>
        <a href="" id="nav-analytics">Analytics :8003</a>
    </nav>

    <div class="header">
        <h1><span>Py</span>Broker</h1>
        <div class="status">
            <div class="status-dot" id="status-dot"></div>
            <span id="status-text">Connecting...</span>
            <span>&nbsp;|&nbsp;</span>
            <span id="uptime">--:--:--</span>
        </div>
    </div>

    <div class="metrics" id="metrics"></div>

    <div class="grid">
        <div class="section">
            <div class="section-title">Connections <span id="conn-count"></span></div>
            <div id="connections-body"></div>
        </div>
        <div class="section">
            <div class="section-title">Topics <span id="topic-count"></span></div>
            <div id="topics-body"></div>
        </div>
    </div>

    <div class="section">
        <div class="section-title">Queues <span id="queue-count"></span></div>
        <div id="queues-body"></div>
    </div>

    <script>
        const host = window.location.hostname;
        document.getElementById('nav-orders').href = `http://${host}:8001`;
        document.getElementById('nav-notif').href = `http://${host}:8002`;
        document.getElementById('nav-analytics').href = `http://${host}:8003`;

        function formatUptime(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        }

        function fmt(n) {
            return n.toLocaleString();
        }

        function renderMetrics(m) {
            const items = [
                {label: 'Published', value: m.published, cls: 'blue'},
                {label: 'Delivered', value: m.delivered, cls: 'blue'},
                {label: 'Acked', value: m.acked, cls: 'green'},
                {label: 'Nacked', value: m.nacked, cls: 'red'},
                {label: 'Timeouts', value: m.timeouts, cls: 'orange'},
            ];
            document.getElementById('metrics').innerHTML = items.map(i =>
                `<div class="metric-card ${i.cls}"><div class="label">${i.label}</div><div class="value">${fmt(i.value)}</div></div>`
            ).join('');
        }

        function renderConnections(conns) {
            document.getElementById('conn-count').textContent = `(${conns.length})`;
            if (!conns.length) {
                document.getElementById('connections-body').innerHTML = '<div class="empty">No active connections</div>';
                return;
            }
            let html = '<table><thead><tr><th>Peer</th><th>Subscriptions</th></tr></thead><tbody>';
            for (const c of conns) {
                const subs = c.subscriptions.map(s => s.destination).join(', ') || '—';
                html += `<tr><td>${c.peer}</td><td>${subs}</td></tr>`;
            }
            html += '</tbody></table>';
            document.getElementById('connections-body').innerHTML = html;
        }

        function renderTopics(topics) {
            document.getElementById('topic-count').textContent = `(${topics.length})`;
            if (!topics.length) {
                document.getElementById('topics-body').innerHTML = '<div class="empty">No active topics</div>';
                return;
            }
            let html = '<table><thead><tr><th>Destination</th><th>Subscribers</th></tr></thead><tbody>';
            for (const t of topics) {
                html += `<tr><td>${t.name}</td><td>${t.subscribers}</td></tr>`;
            }
            html += '</tbody></table>';
            document.getElementById('topics-body').innerHTML = html;
        }

        function renderQueues(queues) {
            document.getElementById('queue-count').textContent = `(${queues.length})`;
            if (!queues.length) {
                document.getElementById('queues-body').innerHTML = '<div class="empty">No queues</div>';
                return;
            }
            let html = '<table><thead><tr><th>Name</th><th>Type</th><th>Ready</th><th>In-Flight</th><th>Consumers</th><th>Timeout</th><th>Max Retries</th></tr></thead><tbody>';
            for (const q of queues) {
                const badge = q.type === 'LIFO' ? 'lifo' : 'fifo';
                html += `<tr><td>${q.name}</td><td><span class="badge ${badge}">${q.type}</span></td><td>${q.ready}</td><td>${q.in_flight}</td><td>${q.consumers}</td><td>${q.visibility_timeout}s</td><td>${q.max_deliveries}</td></tr>`;
            }
            html += '</tbody></table>';
            document.getElementById('queues-body').innerHTML = html;
        }

        async function refresh() {
            try {
                const res = await fetch('/api/state');
                const data = await res.json();
                document.getElementById('status-dot').classList.remove('offline');
                document.getElementById('status-text').textContent = 'Online';
                document.getElementById('uptime').textContent = formatUptime(data.uptime);
                renderMetrics(data.metrics);
                renderConnections(data.connections);
                renderTopics(data.topics);
                renderQueues(data.queues);
            } catch (e) {
                document.getElementById('status-dot').classList.add('offline');
                document.getElementById('status-text').textContent = 'Offline';
            }
        }

        refresh();
        setInterval(refresh, 2000);
    </script>
</body>
</html>
